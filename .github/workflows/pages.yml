name: Deploy Hugo site to Pages

on:
  push:
    branches: [ "trunk" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.134.3'
          extended: true

      # 关键：把仓库根当作主题复制到 exampleSite/themes/local
      - name: Prepare theme
        run: |
          rm -rf exampleSite/themes/local
          mkdir -p exampleSite/themes/local
          rsync -a --delete \
            --exclude 'exampleSite' \
            --exclude '.git' \
            --exclude '.github' \
            ./ exampleSite/themes/local/

      - name: Build
        run: hugo --minify -s exampleSite

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
